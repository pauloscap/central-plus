<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CENTRAL+ • Player</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--bg:#0a0a14;--purple:#8b5cf6;--border:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.mono{font-family:'JetBrains Mono',monospace}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);backdrop-filter:blur(20px);background:rgba(10,10,20,.9);position:sticky;top:0;z-index:10}
.logo{font-weight:900;display:flex;align-items:center;gap:10px}
.logo b{width:32px;height:32px;background:#fff;color:#000;display:grid;place-items:center;border-radius:8px}
.badge{font-size:10px;padding:4px 10px;border-radius:20px;background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.3);color:#c4b5fd}
.player-wrap{flex:1;position:relative;background:#000;display:grid;place-items:center}
video{width:100%;height:100%;max-height:calc(100vh - 64px);background:#000}
iframe{width:100%;height:calc(100vh - 64px);border:0;background:#000}
.controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:12px;background:rgba(0,0,0,.7);backdrop-filter:blur(20px);padding:8px 16px;border-radius:999px;border:1px solid var(--border)}
.btn{padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer}
.btn-white{background:#fff;color:#000;font-weight:700}
.info{padding:16px 24px;border-top:1px solid var(--border);background:rgba(255,255,255,.03)}
</style>
</head>
<body>
<header>
<div class="logo"><b>+</b> CENTRAL+ • Player • <span id="appName">Carregando...</span></div>
<div style="display:flex;gap:8px;align-items:center">
<div class="badge" id="typeBadge">STREAMING</div>
<a href="../apps/" style="color:#fff;text-decoration:none;font-size:13px;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid var(--border)">‹ Apps</a>
<a href="../" style="color:#fff;text-decoration:none;font-size:13px;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid var(--border)">⌂ Home</a>
</div>
</header>
<div class="player-wrap" id="playerWrap">
<div id="loading" style="text-align:center"><div style="font-size:32px">📡</div><div style="margin-top:12px">Carregando streaming...</div><div class="mono" style="font-size:11px;color:#9A9AB5;margin-top:8px" id="urlInfo"></div></div>
<video id="video" controls style="display:none"></video>
<iframe id="iframe" style="display:none" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
</div>
<div class="info">
<div style="display:flex;justify-content:space-between;align-items:center">
<div><div style="font-weight:700" id="infoTitle">App</div><div class="mono" style="font-size:11px;color:#9A9AB5" id="infoSub">Hospedado na CENTRAL+</div></div>
<div style="display:flex;gap:8px">
<button class="btn" onclick="toggleFullscreen()">⛶ Tela Cheia (Fire TV)</button>
<button class="btn btn-white" onclick="reload()">↻ Recarregar</button>
</div>
</div>
</div>
<script>
function getParam(name){let u=new URL(window.location.href); return u.searchParams.get(name);}
async function init(){
 let name = getParam('name') || 'Streaming';
 let url = getParam('url') || '';
 let type = getParam('type') || 'iframe';
 document.getElementById('appName').textContent=name;
 document.getElementById('infoTitle').textContent=name;
 document.getElementById('urlInfo').textContent=url;
 document.getElementById('typeBadge').textContent=type.toUpperCase()+' • Hospedado';
 let video=document.getElementById('video');
 let iframe=document.getElementById('iframe');
 let loading=document.getElementById('loading');
 if(!url){ loading.innerHTML='<div>❌ Sem URL</div><div class="mono" style="font-size:11px;margin-top:8px">Adicione ?url=SEU_STREAM&type=hls ou iframe&name=NOME</div>'; return; }
 if(type==='hls' || url.includes('.m3u8')){
  // HLS
  loading.style.display='none';
  video.style.display='block';
  if(Hls.isSupported()){
   let hls=new Hls(); hls.loadSource(url); hls.attachMedia(video);
   hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
  } else if(video.canPlayType('application/vnd.apple.mpegurl')){
   video.src=url; video.addEventListener('loadedmetadata',()=>video.play());
  }
 } else {
  // Iframe (Netflix, Disney+, seu streaming web)
  loading.style.display='none';
  iframe.style.display='block';
  iframe.src=url;
 }
}
function toggleFullscreen(){
 let el=document.getElementById('playerWrap');
 if(document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen();
}
function reload(){ location.reload(); }
init();
</script>
</body>
</html>
